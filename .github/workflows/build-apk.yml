name: Build LERN X APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - run: npm install

      - run: npx cap add android

      - name: Patch Permissions & Sticker Share Menu
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          # Add permissions
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $MANIFEST
          
          # Patch AndroidManifest for Sticker Share
          python3 << 'EOF'
          import re
          path = "android/app/src/main/AndroidManifest.xml"
          with open(path) as f:
              xml = f.read()

          intent_filters = '''
                      <!-- LERN X: Sticker Pack Import -->
                      <intent-filter android:label="Import to LERN X">
                          <action android:name="android.intent.action.SEND" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <data android:mimeType="application/zip" />
                          <data android:mimeType="application/octet-stream" />
                          <data android:mimeType="*/*" />
                      </intent-filter>
                      <intent-filter android:label="Open in LERN X">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data android:scheme="content" android:host="*" android:mimeType="*/*" />
                          <data android:scheme="file" android:host="*" android:pathPattern=".*\\\\.wastickers" />
                      </intent-filter>
          '''
          xml = re.sub(r'(<activity\b[^>]*MainActivity[^>]*>)', r'\1' + intent_filters, xml, count=1)
          with open(path, "w") as f:
              f.write(xml)
          print("✅ Manifest patched for Sticker Share")
          EOF

      - name: Patch MainActivity (Handle Shared File)
        run: |
          python3 << 'EOF'
          import sys, os
          java_file = None
          for root, dirs, files in os.walk("android/app/src/main/java"):
              for file in files:
                  if file == "MainActivity.java":
                      java_file = os.path.join(root, file)
                      break
          if not java_file:
              print("MainActivity.java not found")
              sys.exit(1)

          with open(java_file) as f:
              code = f.read()

          imports = '''import android.content.Intent;
          import android.net.Uri;
          import android.os.Bundle;
          import com.getcapacitor.BridgeActivity;
          '''
          if "import android.content.Intent;" not in code:
              code = code.replace("import com.getcapacitor.BridgeActivity;", imports)

          oncreate = '''
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  handleIncomingIntent(getIntent());
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  handleIncomingIntent(intent);
              }

              private void handleIncomingIntent(Intent intent) {
                  if (intent == null) return;
                  String action = intent.getAction();
                  if (Intent.ACTION_SEND.equals(action) || Intent.ACTION_VIEW.equals(action)) {
                      Uri uri = intent.getParcelableExtra(Intent.EXTRA_STREAM);
                      if (uri == null && Intent.ACTION_VIEW.equals(action)) uri = intent.getData();
                      if (uri != null) {
                          String url = "lernx://import-sticker?uri=" + Uri.encode(uri.toString());
                          if (getBridge() != null && getBridge().getWebView() != null) {
                              final String u = url;
                              getBridge().getWebView().post(new Runnable() {
                                  @Override public void run() {
                                      getBridge().getWebView().evaluateJavascript(
                                          "window.handleIncomingSticker && window.handleIncomingSticker('" + u + "')",
                                          null);
                                  }
                              });
                          }
                      }
                  }
              }
          '''
          idx = code.rfind('}')
          code = code[:idx] + oncreate + code[idx:]
          with open(java_file, "w") as f:
              f.write(code)
          print("✅ MainActivity patched for File Handling")
          EOF

      - run: npx capacitor-assets generate --android --iconBackgroundColor '#080b1a' --splashBackgroundColor '#080b1a' || true
      
      - run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - run: cp android/app/build/outputs/apk/debug/app-debug.apk LERN-X.apk
      
      - uses: actions/upload-artifact@v4
        with:
          name: LERN-X-APK
          path: LERN-X.apk
          
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: LERN X - build ${{ github.run_number }}
          files: LERN-X.apk
