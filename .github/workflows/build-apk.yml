name: Build ZERO CHAT APK
on:
  push: { branches: [main, master] }
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm install
      - run: npx cap add android
      - name: Mic / camera permissions (voice msgs + calls)
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' $M
          grep -c RECORD_AUDIO $M
      - run: npx capacitor-assets generate --android --iconBackgroundColor '#0b141a' --splashBackgroundColor '#0b141a' || true
      - run: npx cap sync android
      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk ZERO-CHAT.apk
      - uses: actions/upload-artifact@v4
        with: { name: ZERO-CHAT-APK, path: ZERO-CHAT.apk }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: ZERO CHAT - build ${{ github.run_number }}
          files: ZERO-CHAT.apk
