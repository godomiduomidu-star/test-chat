<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#080b1a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>LERN X</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Sinhala:wght@400;500;600;700;800;900&family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<style>
:root{--bg:#080b1a;--bg2:#0e1430;--bg3:#151d3e;--bg4:#1f2a55;--tx:#eef2ff;--tx2:#a8b3d6;--tx3:#6b76a0;--gr:#e8457c;--gr2:#ff6fa5;--bl:#5eb8ff;--vi:#a06cff;--cy:#4ae3d0;--am:#f0b232;--rd:#f15c6d;--gn:#22c55e;--in:#1a2450;--bd:rgba(94,184,255,.12);--fs:14.5px;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;height:100dvh;overflow:hidden;overscroll-behavior:none;}
body{font-family:'Noto Sans Sinhala','Inter',-apple-system,sans-serif;background:var(--bg);color:var(--tx);font-size:var(--fs);line-height:1.45;background-image:radial-gradient(circle at 15% 0%,rgba(160,108,255,.16),transparent 45%),radial-gradient(circle at 85% 100%,rgba(232,69,124,.12),transparent 45%);background-attachment:fixed;}
input,textarea,button,select{font-family:inherit;font-size:inherit;color:inherit;background:none;border:none;outline:none;}
button{cursor:pointer;}
.screen{position:fixed;inset:0;display:none;flex-direction:column;background:var(--bg);z-index:1;}
.screen.on{display:flex;}

/* SPLASH */
#splash{background:radial-gradient(ellipse at top,#1a1145 0%,#0a0e27 60%,#050818 100%);align-items:center;justify-content:center;z-index:999;overflow:hidden;}
.lx-rings{position:absolute;top:50%;left:50%;width:280px;height:280px;transform:translate(-50%,-50%);pointer-events:none;}
.lx-ring{position:absolute;border-radius:50%;border:2.5px solid transparent;}
.lx-ring.r1{inset:0;border-top-color:#a06cff;border-right-color:#e8457c;animation:spinL 4s linear infinite;}
.lx-ring.r2{inset:28px;border-top-color:#4ae3d0;border-left-color:#ff6fa5;animation:spinR 3s linear infinite;}
.lx-ring.r3{inset:56px;border-top-color:#fff;border-right-color:#a06cff;animation:spinL 2s linear infinite;opacity:.7;}
@keyframes spinL{to{transform:rotate(360deg)}}
@keyframes spinR{to{transform:rotate(-360deg)}}
.brand-lx{position:relative;z-index:2;display:flex;align-items:center;gap:8px;animation:popIn .9s cubic-bezier(.34,1.56,.64,1) both;}
.brand-lx .lern{font-family:'Inter',sans-serif;font-size:52px;font-weight:900;letter-spacing:5px;background:linear-gradient(180deg,#fff,#c99dff);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:0 0 40px rgba(201,157,255,.4);}
.brand-lx .x{font-family:'Inter',sans-serif;font-size:130px;font-weight:900;line-height:.85;margin-left:4px;background:linear-gradient(135deg,#a06cff,#ff6fa5,#4ae3d0);background-size:200% 200%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:xBeat 2.2s ease-in-out infinite,xShimmer 4s linear infinite;}
@keyframes xBeat{0%,100%{transform:scale(1);filter:drop-shadow(0 0 20px rgba(160,108,255,.9))}50%{transform:scale(1.14) rotate(-3deg);filter:drop-shadow(0 0 50px rgba(232,69,124,1))}}
@keyframes xShimmer{0%{background-position:0% 50%}100%{background-position:200% 50%}}
@keyframes popIn{from{transform:scale(.3) rotate(-20deg);opacity:0}to{transform:none;opacity:1}}
#splash .tag{font-size:12px;color:var(--tx2);margin-top:56px;letter-spacing:4px;text-transform:uppercase;position:relative;z-index:2;}
#splash .load{margin-top:24px;width:80px;height:4px;border-radius:4px;background:rgba(255,255,255,.1);overflow:hidden;position:relative;z-index:2;}
#splash .load::after{content:'';display:block;height:100%;width:40%;border-radius:4px;background:linear-gradient(90deg,transparent,#a06cff,#e8457c,transparent);animation:loadbar 1.4s ease-in-out infinite;}
@keyframes loadbar{0%{transform:translateX(-100%)}100%{transform:translateX(300%)}}
#splash .ft{position:absolute;bottom:calc(38px + env(safe-area-inset-bottom));font-size:11px;color:var(--tx3);letter-spacing:2px;z-index:2;}

/* AUTH */
#auth{background:linear-gradient(180deg,#0a0e27,#151d3e);}
.auth-top{padding:calc(60px + env(safe-area-inset-top)) 24px 30px;display:flex;flex-direction:column;align-items:center;}
.auth-top .mini-logo{font-family:'Inter',sans-serif;font-size:32px;font-weight:900;letter-spacing:3px;background:linear-gradient(135deg,#a06cff,#ff6fa5,#4ae3d0);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 18px rgba(160,108,255,.5));}
.auth-top p{font-size:13px;color:var(--tx2);margin-top:8px;}
.auth-body{flex:1;background:var(--bg2);border-radius:30px 30px 0 0;padding:28px 22px calc(24px + env(safe-area-inset-bottom));overflow-y:auto;}
.auth-body h2{font-size:19px;font-weight:800;margin-bottom:6px;}
.auth-body .sub{font-size:13px;color:var(--tx2);margin-bottom:22px;line-height:1.5;}
.ig{position:relative;margin-bottom:14px;}
.ig>i{position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--tx3);font-size:15px;pointer-events:none;}
.inp{width:100%;padding:15px 16px 15px 44px;background:var(--bg3);border-radius:14px;font-size:16px;color:var(--tx);border:1.5px solid transparent;transition:border-color .2s,box-shadow .2s;}
.inp:focus{border-color:var(--vi);box-shadow:0 0 0 4px rgba(160,108,255,.15);}
.inp.flat{padding:14px 16px;}
.btn1{width:100%;padding:16px;background:linear-gradient(135deg,#a06cff,#e8457c);color:#fff;border-radius:14px;font-weight:800;font-size:15px;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .15s,box-shadow .2s;box-shadow:0 8px 24px rgba(160,108,255,.35);}
.btn1:active{transform:scale(.97);}
.btn1:disabled{opacity:.55;pointer-events:none;}
.hint{background:rgba(160,108,255,.08);border:1px solid rgba(160,108,255,.2);padding:13px 15px;border-radius:12px;font-size:12.5px;color:#c99dff;margin-top:18px;line-height:1.6;}

/* HEADER */
.tb{display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 16px 12px;background:rgba(14,20,48,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);position:sticky;top:0;z-index:10;}
.tb .brand{flex:1;font-family:'Inter',sans-serif;font-size:22px;font-weight:900;letter-spacing:1px;}
.tb .brand .x{background:linear-gradient(135deg,#a06cff,#ff6fa5,#4ae3d0);-webkit-background-clip:text;background-clip:text;color:transparent;font-size:26px;margin-left:2px;animation:xMini 2s ease-in-out infinite;display:inline-block;}
@keyframes xMini{0%,100%{filter:drop-shadow(0 0 4px rgba(160,108,255,.6));transform:scale(1)}50%{filter:drop-shadow(0 0 12px rgba(232,69,124,.9));transform:scale(1.1)}}
.ib{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--tx2);font-size:17px;transition:background .15s;}
.ib:active{background:rgba(255,255,255,.08);}
.lst{flex:1;overflow-y:auto;padding-bottom:140px;padding-top:6px;-webkit-overflow-scrolling:touch;}
.lst::-webkit-scrollbar{width:0;}

/* BOTTOM NAV */
.bnav{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));padding:7px;border-radius:28px;background:rgba(21,29,62,.9);backdrop-filter:blur(24px) saturate(170%);-webkit-backdrop-filter:blur(24px) saturate(170%);border:1px solid rgba(255,255,255,.1);box-shadow:0 16px 48px rgba(0,0,0,.5);display:flex;gap:3px;z-index:60;}
.bnav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--tx2);font-size:10px;font-weight:600;padding:9px 0 7px;border-radius:22px;transition:all .25s cubic-bezier(.3,1.4,.5,1);position:relative;}
.bnav a i{font-size:19px;}
.bnav a.on{color:#fff;background:linear-gradient(135deg,#a06cff,#e8457c);box-shadow:0 8px 20px rgba(160,108,255,.5);flex:1.35;}
.bnav a.on i{transform:translateY(-1px) scale(1.1);}

/* COMMON */
.av{width:50px;height:50px;border-radius:50%;background:linear-gradient(135deg,#a06cff,#e8457c);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:#fff;flex-shrink:0;overflow:hidden;position:relative;box-shadow:0 4px 14px rgba(160,108,255,.3);}
.av img{width:100%;height:100%;object-fit:cover;}
.av .dot{position:absolute;bottom:1px;right:1px;width:13px;height:13px;border-radius:50%;background:var(--gn);border:2.5px solid var(--bg2);display:none;}
.av.on .dot{display:block;}
.av .crown{position:absolute;top:-2px;right:-2px;width:19px;height:19px;border-radius:50%;background:linear-gradient(135deg,#f0b232,#f59e0b);color:#fff;font-size:9px;display:flex;align-items:center;justify-content:center;border:2px solid var(--bg2);}
.ci{display:flex;gap:13px;padding:11px 14px;margin:4px 8px;border-radius:18px;cursor:pointer;transition:background .12s;}
.ci:active{background:rgba(255,255,255,.06);}
.ci-info{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.ci-top{display:flex;align-items:center;justify-content:space-between;gap:8px;}
.ci-name{font-weight:600;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px;}
.ci-name .bdg{display:inline-flex;align-items:center;justify-content:center;width:14px;height:14px;border-radius:50%;background:linear-gradient(135deg,#f0b232,#f59e0b);color:#fff;font-size:8px;}
.ci-time{font-size:11.5px;color:var(--tx3);flex-shrink:0;}
.ci-bot{display:flex;align-items:center;gap:6px;margin-top:3px;}
.ci-msg{flex:1;font-size:13.5px;color:var(--tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ci-un{min-width:20px;height:20px;padding:0 6px;border-radius:10px;background:var(--gr2);color:#080b1a;font-size:11px;font-weight:800;display:flex;align-items:center;justify-content:center;}
.empty{padding:60px 24px;text-align:center;color:var(--tx2);display:flex;flex-direction:column;align-items:center;gap:16px;}
.empty i{font-size:52px;opacity:.2;}
.empty h3{font-size:16px;font-weight:700;color:var(--tx);}
.empty p{font-size:13.5px;line-height:1.6;max-width:280px;}
.sp{width:26px;height:26px;border:3px solid var(--bg3);border-top-color:var(--vi);border-radius:50%;animation:spin .7s linear infinite;margin:30px auto;}
@keyframes spin{to{transform:rotate(360deg)}}
.fab{position:fixed;bottom:calc(96px + env(safe-area-inset-bottom));right:18px;width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,#a06cff,#e8457c);color:#fff;font-size:22px;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 28px rgba(160,108,255,.5);z-index:50;transition:transform .15s;}
.fab:active{transform:scale(.9);}

/* HERO */
.hero{margin:10px 14px;border-radius:22px;padding:22px 20px;background:linear-gradient(135deg,#a06cff 0%,#e8457c 100%);position:relative;overflow:hidden;box-shadow:0 12px 32px rgba(160,108,255,.4);animation:slideUp .4s both;}
@keyframes slideUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.hero::after{content:'';position:absolute;top:-40px;right:-40px;width:140px;height:140px;border-radius:50%;background:rgba(255,255,255,.15);}
.hero h2{font-size:20px;font-weight:900;color:#fff;position:relative;z-index:1;}
.hero p{font-size:13px;color:rgba(255,255,255,.9);margin-top:6px;position:relative;z-index:1;}
.hero .stat-row{display:flex;gap:10px;margin-top:14px;position:relative;z-index:1;}
.hero .stat{flex:1;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);border-radius:12px;padding:8px 10px;text-align:center;}
.hero .stat b{font-size:18px;color:#fff;display:block;font-family:'Inter',sans-serif;}
.hero .stat small{font-size:10.5px;color:rgba(255,255,255,.85);text-transform:uppercase;letter-spacing:.4px;}

/* TODAY CARD */
.today-card{margin:10px 14px;padding:16px;background:linear-gradient(135deg,rgba(74,227,208,.15),rgba(94,184,255,.08));border-radius:20px;border:1px solid rgba(74,227,208,.25);animation:slideUp .4s .05s both;}
.today-card h3{font-size:13px;font-weight:800;color:var(--cy);text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px;display:flex;align-items:center;gap:6px;}
.today-stats{display:flex;gap:10px;}
.today-stat{flex:1;text-align:center;padding:10px 6px;background:rgba(255,255,255,.05);border-radius:12px;}
.today-stat b{font-size:22px;font-family:'Inter',sans-serif;color:#fff;font-weight:900;display:block;line-height:1;}
.today-stat small{font-size:10px;color:var(--tx2);display:block;margin-top:5px;text-transform:uppercase;letter-spacing:.3px;}

/* SUBJECT */
.subject-grid{padding:8px 14px;display:grid;grid-template-columns:repeat(2,1fr);gap:12px;}
.subj-card{background:var(--bg3);border-radius:18px;padding:16px 14px;cursor:pointer;transition:transform .18s;position:relative;overflow:hidden;border:1px solid var(--bd);animation:slideUp .35s both;}
.subj-card:active{transform:scale(.96);}
.subj-card .ic{width:44px;height:44px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:20px;color:#fff;margin-bottom:12px;box-shadow:0 6px 16px rgba(0,0,0,.3);}
.subj-card h4{font-size:14px;font-weight:800;color:var(--tx);line-height:1.3;margin-bottom:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:36px;}
.subj-card .cnt{font-size:11.5px;color:var(--tx3);display:flex;align-items:center;gap:4px;}
.subj-card .prog{height:4px;border-radius:4px;background:rgba(255,255,255,.08);margin-top:10px;overflow:hidden;}
.subj-card .prog>div{height:100%;border-radius:4px;background:linear-gradient(90deg,#a06cff,#e8457c);transition:width .5s;}

/* VIDEO CARD */
.vid-card{display:flex;gap:12px;padding:11px 14px;margin:6px 10px;background:var(--bg3);border-radius:16px;cursor:pointer;transition:transform .15s;border:1px solid var(--bd);position:relative;}
.vid-card:active{transform:scale(.98);}
.vid-thumb{width:110px;height:62px;border-radius:10px;object-fit:cover;flex-shrink:0;background:#000;position:relative;overflow:hidden;}
.vid-thumb img{width:100%;height:100%;object-fit:cover;}
.vid-thumb .play{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:28px;height:28px;border-radius:50%;background:rgba(0,0,0,.7);color:#fff;display:flex;align-items:center;justify-content:center;font-size:11px;box-shadow:0 0 0 2px rgba(255,0,0,.5);}
.vid-thumb .watched{position:absolute;inset:0;background:rgba(34,197,94,.7);display:flex;align-items:center;justify-content:center;color:#fff;font-size:20px;}
.vid-body{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;}
.vid-body h4{font-size:13.5px;font-weight:700;line-height:1.35;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;}
.vid-body .tags{display:flex;gap:5px;margin-top:6px;flex-wrap:wrap;}
.tag{display:inline-block;padding:2px 8px;border-radius:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;}
.tag.vi{background:rgba(160,108,255,.2);color:var(--vi);}
.tag.bl{background:rgba(94,184,255,.2);color:var(--bl);}
.tag.gn{background:rgba(34,197,94,.2);color:var(--gn);}
.tag.am{background:rgba(240,178,50,.18);color:var(--am);}
.tag.rd{background:rgba(241,92,109,.2);color:var(--rd);}

/* GOALS */
.goal-card{margin:8px 14px;padding:14px;background:linear-gradient(135deg,rgba(160,108,255,.12),rgba(232,69,124,.08));border-radius:16px;border:1px solid rgba(160,108,255,.25);display:flex;gap:12px;align-items:flex-start;animation:slideUp .3s both;}
.goal-card.done{opacity:.55;}
.goal-card .chk{width:24px;height:24px;border-radius:8px;border:2px solid var(--vi);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;transition:all .2s;background:transparent;color:transparent;}
.goal-card.done .chk{background:var(--vi);color:#fff;border-color:var(--vi);}
.goal-card .body{flex:1;min-width:0;}
.goal-card .body b{font-size:14px;font-weight:700;display:block;line-height:1.4;}
.goal-card.done .body b{text-decoration:line-through;}
.goal-card .body small{font-size:11.5px;color:var(--tx3);margin-top:3px;display:block;}
.task-card{margin:8px 14px;padding:14px;background:var(--bg3);border-radius:16px;display:flex;gap:12px;align-items:flex-start;border-left:4px solid var(--am);}
.task-card.done{opacity:.55;border-left-color:var(--gn);}
.task-card .chk{width:24px;height:24px;border-radius:50%;border:2px solid var(--am);display:flex;align-items:center;justify-content:center;flex-shrink:0;cursor:pointer;color:transparent;transition:.2s;}
.task-card.done .chk{background:var(--gn);color:#fff;border-color:var(--gn);}
.task-card .body{flex:1;min-width:0;}
.task-card .body b{font-size:14px;font-weight:600;display:block;line-height:1.4;}
.task-card.done .body b{text-decoration:line-through;}
.task-card .body small{font-size:11.5px;color:var(--tx3);margin-top:3px;display:block;}

/* TIMETABLE */
.day-tabs{display:flex;gap:6px;padding:8px 14px;overflow-x:auto;}
.day-tabs::-webkit-scrollbar{display:none;}
.day-tab{flex-shrink:0;padding:8px 16px;border-radius:14px;background:var(--bg3);color:var(--tx2);font-size:12.5px;font-weight:700;border:1px solid transparent;}
.day-tab.on{background:linear-gradient(135deg,#a06cff,#e8457c);color:#fff;box-shadow:0 6px 16px rgba(160,108,255,.4);}
.period{display:flex;gap:12px;margin:8px 14px;padding:14px;background:var(--bg3);border-radius:16px;border-left:4px solid var(--vi);}
.period .time{width:76px;flex-shrink:0;text-align:center;}
.period .time .t1{font-size:15px;font-weight:800;}
.period .time .t2{font-size:11px;color:var(--tx3);margin-top:2px;}
.period .body{flex:1;min-width:0;}
.period .body h4{font-size:14px;font-weight:700;}
.period .body p{font-size:12px;color:var(--tx2);margin-top:4px;}
.period .body .subj-chip{display:inline-block;margin-top:6px;padding:3px 10px;border-radius:10px;font-size:11px;font-weight:700;background:rgba(160,108,255,.2);color:var(--vi);}

/* STATS */
.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;padding:8px 14px;}
.stat-card{background:var(--bg3);border-radius:18px;padding:16px;text-align:center;border:1px solid var(--bd);}
.stat-card .ic{width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:18px;color:#fff;margin:0 auto 10px;}
.stat-card b{font-size:26px;font-weight:900;font-family:'Inter',sans-serif;display:block;}
.stat-card small{font-size:11.5px;color:var(--tx2);text-transform:uppercase;letter-spacing:.5px;margin-top:3px;display:block;}

/* CHAT */
#chatRoom{background:var(--bg);}
.cr-head{display:flex;align-items:center;gap:11px;padding:calc(8px + env(safe-area-inset-top)) 10px 8px;background:rgba(14,20,48,.9);backdrop-filter:blur(20px);border-bottom:1px solid var(--bd);position:relative;z-index:5;}
.cr-head .bk{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;color:var(--tx2);}
.cr-head .av{width:40px;height:40px;font-size:15px;}
.cr-head .info{flex:1;min-width:0;}
.cr-head .info .nm{font-weight:700;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.cr-head .info .st{font-size:12px;color:var(--tx2);margin-top:1px;}
.cr-head .info .st.ty{color:var(--gr2);}
.msgs{flex:1;overflow-y:auto;padding:12px 8px 8px;display:flex;flex-direction:column;gap:2px;background:var(--bg);-webkit-overflow-scrolling:touch;}
.msgs::-webkit-scrollbar{width:0;}
.msg{max-width:80%;padding:7px 10px 7px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;word-wrap:break-word;position:relative;box-shadow:0 1px 1px rgba(0,0,0,.15);animation:mi .25s cubic-bezier(.2,.9,.3,1.3);}
@keyframes mi{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.msg.out{align-self:flex-end;background:linear-gradient(135deg,#a3204f,#7a1840);border-bottom-right-radius:4px;}

window.pickSetupAv=async function(inp){const f=inp.files[0];if(!f)return;if(f.size>5*1024*1024){toast("Max 5MB");inp.value="";return;}toast("Uploading...");try{const b=await compressImg(f,512,0.85);const u=await upImgBlob(b,"av.jpg");pendingAv=u;$("sAvImg").src=u;$("sAvImg").style.display="block";$("sAvInit").style.display="none";toast("Done ✅");}catch(e){toast("Failed: "+e.message);}};
window.saveSetup=async function(){const n=($("sName").value||"").trim();if(!n){toast("Enter name");return;}const ab=($("sAbout").value||"").trim()||"Hey! I'm using LERN X";const d={phone:ME.phone,name:n,about:ab,photoURL:pendingAv||"",createdAt:Date.now(),lastSeen:Date.now(),online:true};await set(ref(db,"users/"+ME.uid),d);ME={uid:ME.uid,...d};cache.set("me",ME);enterApp();};

function enterApp(){show("home");if(appEntered){setTab(tab);return;}appEntered=true;unreadLocal=cache.get("unread",{});updatePresence();listenMe();listenUsers();listenChats();listenSubjects();listenTimetable();listenDailyGoals();listenTasks();listenProgress();listenStudySessions();listenBookmarks();listenNotes();listenMyStickers();listenConfig();applyPrefs();setTab("learn");}

function listenMe(){onValue(ref(db,"users/"+ME.uid),s=>{const v=s.val();if(!v||!ME)return;ME={uid:ME.uid,...v};cache.set("me",ME);applyPrefs();});}

function listenTimetable(){if(ttUn)off(ref(db,"timetable"));ttUn=onValue(ref(db,"timetable"),s=>{TIMETABLE=s.val()||{};if(tab==="study"&&studyTab==="timetable")renderHome();});}
function listenDailyGoals(){if(dgUn)off(ref(db,"dailygoals/"+ME.uid));dgUn=onValue(ref(db,"dailygoals/"+ME.uid),s=>{DAILY_GOALS=s.val()||{};if(tab==="study"&&studyTab==="goals")renderHome();if(tab==="learn")renderHome();});}
function listenTasks(){if(tasksUn)off(ref(db,"tasks/"+ME.uid));tasksUn=onValue(ref(db,"tasks/"+ME.uid),s=>{TASKS=s.val()||{};if(tab==="study"&&studyTab==="tasks")renderHome();});}
function listenProgress(){if(progUn)off(ref(db,"progress/"+ME.uid));progUn=onValue(ref(db,"progress/"+ME.uid),s=>{PROGRESS=s.val()||{};if(tab==="stats"||tab==="learn")renderHome();});}
function listenStudySessions(){if(ssUn)off(ref(db,"studysessions/"+ME.uid));ssUn=onValue(ref(db,"studysessions/"+ME.uid),s=>{STUDY_SESSIONS=s.val()||{};if(tab==="stats"||tab==="learn")renderHome();});}
function listenBookmarks(){if(bmUn)off(ref(db,"bookmarks/"+ME.uid));bmUn=onValue(ref(db,"bookmarks/"+ME.uid),s=>{BOOKMARKS=s.val()||{};if(tab==="learn"&&curSubject)renderHome();});}
function listenNotes(){if(notesUn)off(ref(db,"notes/"+ME.uid));notesUn=onValue(ref(db,"notes/"+ME.uid),s=>{NOTES=s.val()||{};if($("notesListBody"))renderNotesList();});}
function listenMyStickers(){if(stkUn)off(ref(db,"stickers/"+ME.uid));stkUn=onValue(ref(db,"stickers/"+ME.uid),s=>{MY_STICKERS=s.val()||{};if($("stkSheetBody"))renderStickerSheet();});}

window.setTab=function(t){
  tab=t;
  document.querySelectorAll('.bnav a').forEach(a=>a.classList.toggle('on',a.dataset.nav===t));
  const hb=$("homeBody");hb.classList.remove("swap");void hb.offsetWidth;hb.classList.add("swap");
  $("fabBtn").style.display=(t==="learn"||t==="study")?"flex":"none";
  fabMode=t==="learn"?"learn":"study";
  $("fabBtn").innerHTML=t==="learn"?'<i class="fas fa-search"></i>':'<i class="fas fa-plus"></i>';
  renderHome();
};
function renderHome(){
  if(tab==="learn")renderLearn();
  else if(tab==="study")renderStudy();
  else if(tab==="chat")renderChats();
  else if(tab==="stats")renderStats();
}
window.fabAction=function(){
  if(fabMode==="learn")openGlobalSearch();
  else if(studyTab==="goals")newDailyGoal();
  else if(studyTab==="tasks")newTask();
  else toast("Nothing to add here");
};

/* ═════════ TODAY STATS ═════════ */
function todayStats(){
  const tk=new Date().toDateString();
  const watched=Object.values(PROGRESS.watched||{}).filter(ts=>new Date(ts).toDateString()===tk).length;
  const studyMin=Object.values(STUDY_SESSIONS||{}).filter(s=>new Date(s.ts).toDateString()===tk).reduce((a,s)=>a+(s.min||0),0);
  const dg=DAILY_GOALS[todayKey()]||{};
  const goalsDone=Object.values(dg).filter(g=>g.done).length;
  const goalsTotal=Object.keys(dg).length;
  return{watched,studyMin,goalsDone,goalsTotal};
}

/* ═════════ LEARN ═════════ */
function renderLearn(){
  if(curSubject){renderSubjectVideos();return;}
  const b=$("homeBody");
  const subs=Object.entries(SUBJECTS).map(([sid,s])=>({sid,...s})).sort((a,b)=>(a.order||0)-(b.order||0));
  const ts=todayStats();
  let html=`<div class="hero"><h2><i class="fas fa-graduation-cap"></i> Continue Learning</h2><p>${subs.length} subjects · ${ts.watched} watched today</p><div class="stat-row"><div class="stat"><b>${ts.watched}</b><small>Today</small></div><div class="stat"><b>${ts.studyMin}</b><small>Min studied</small></div><div class="stat"><b>${ts.goalsDone}/${ts.goalsTotal}</b><small>Goals</small></div></div></div>`;
  if(CFG.examDate){const days=Math.ceil((CFG.examDate-Date.now())/86400000);if(days>=0)html+=`<div class="countdown-card"><h3><i class="fas fa-hourglass-half"></i> Days until exam</h3><div class="big">${days}</div><div class="sub">${new Date(CFG.examDate).toLocaleDateString([],{day:'numeric',month:'long',year:'numeric'})}</div></div>`;}
  html+=`<div class="quote-card"><p>"${getQuote()}"</p><small>💡 Daily motivation</small></div>`;
  const bmCount=Object.keys(BOOKMARKS||{}).length;
  if(bmCount){html+=`<div style="padding:14px 16px 6px;display:flex;align-items:center;gap:8px;"><h3 style="font-size:15px;font-weight:800;flex:1;"><i class="fas fa-bookmark" style="color:var(--am);margin-right:6px;"></i>Watch Later (${bmCount})</h3></div>`;Object.entries(BOOKMARKS).slice(0,3).forEach(([key,bm])=>{const v=(VIDEOS[bm.sid]||{})[bm.vid];if(!v)return;html+=`<div class="vid-card" onclick="playVideo('${bm.sid}','${bm.vid}')"><div class="vid-thumb"><img src="${v.ytId?ytThumb(v.ytId):''}"><div class="play"><i class="fas fa-play"></i></div></div><div class="vid-body"><h4>${esc(v.title||"Video")}</h4><div class="tags"><span class="tag am"><i class="fas fa-bookmark"></i> Saved</span></div></div></div>`;});}
  if(!subs.length){html+=`<div class="empty"><i class="fas fa-book"></i><h3>No subjects yet</h3><p>${meIsAdmin()?"Tap + to add your first subject":"Ask admin to add subjects"}</p></div>`;}
  else{html+=`<div class="subject-grid">${subs.map(s=>{const vids=VIDEOS[s.sid]||{};const vc=Object.keys(vids).length;const watched=Object.keys(vids).filter(vid=>PROGRESS.watched&&PROGRESS.watched[s.sid+"_"+vid]).length;const pct=vc?Math.round(watched/vc*100):0;return`<div class="subj-card" onclick="openSubject('${s.sid}')"><div class="ic" style="background:${s.color||'linear-gradient(135deg,#a06cff,#e8457c)'}"><i class="fas ${s.icon||'fa-book'}"></i></div><h4>${esc(s.name||"Subject")}</h4><div class="cnt"><i class="fas fa-play-circle"></i> ${vc} videos</div><div class="prog"><div style="width:${pct}%"></div></div></div>`;}).join("")}</div>`;}
  b.innerHTML=html;
}
window.openSubject=function(sid){curSubject=sid;listenVideos(sid);renderHome();};
window.closeSubject=function(){curSubject=null;renderHome();};
function renderSubjectVideos(){
  const b=$("homeBody");const s=SUBJECTS[curSubject];
  if(!s){curSubject=null;renderHome();return;}
  const vids=Object.entries(VIDEOS[curSubject]||{}).map(([vid,v])=>({vid,...v})).sort((a,b)=>(a.order||0)-(b.order||0)||(a.ts||0)-(b.ts||0));
  let html=`<div style="display:flex;align-items:center;gap:12px;padding:14px 16px 6px;"><button class="ib" onclick="closeSubject()" style="width:36px;height:36px;"><i class="fas fa-arrow-left"></i></button><div style="flex:1;"><h2 style="font-size:20px;font-weight:800;">${esc(s.name)}</h2><p style="font-size:12.5px;color:var(--tx2);">${vids.length} videos · ${Object.keys(VIDEOS[curSubject]||{}).filter(vid=>PROGRESS.watched&&PROGRESS.watched[curSubject+"_"+vid]).length} watched</p></div><button class="ib" onclick="openNotes('${curSubject}')"><i class="fas fa-pen"></i></button></div>`;
  if(!vids.length){html+=`<div class="empty"><i class="fas fa-video"></i><h3>No videos</h3><p>${meIsAdmin()?"Add videos from Admin":"Ask admin to add videos"}</p></div>`;}
  else{html+=vids.map(v=>{const watched=PROGRESS.watched&&PROGRESS.watched[curSubject+"_"+v.vid];const isBookmarked=!!BOOKMARKS[curSubject+"_"+v.vid];return`<div class="vid-card" onclick="playVideo('${curSubject}','${v.vid}')"><div class="vid-thumb"><img src="${v.ytId?ytThumb(v.ytId):''}" onerror="this.style.opacity=.3"><div class="play"><i class="fas fa-play"></i></div>${watched?'<div class="watched"><i class="fas fa-check"></i></div>':''}</div><div class="vid-body"><h4>${esc(v.title||"Untitled")}</h4><div class="tags">${v.tag?`<span class="tag vi">${esc(v.tag)}</span>`:''}${watched?'<span class="tag gn"><i class="fas fa-check"></i></span>':'<span class="tag bl">New</span>'}</div></div><button class="ib" style="width:36px;height:36px;align-self:center;" onclick="event.stopPropagation();toggleBookmark('${curSubject}','${v.vid}')"><i class="fa${isBookmarked?'s':'r'} fa-bookmark" style="color:${isBookmarked?'var(--am)':'var(--tx3)'}"></i></button></div>`;}).join("");}
  b.innerHTML=html;
}
window.playVideo=async function(sid,vid){
  const v=VIDEOS[sid]&&VIDEOS[sid][vid];if(!v)return;
  if(!v.ytId){toast("No video URL");return;}
  if(!PROGRESS.watched)PROGRESS.watched={};
  PROGRESS.watched[sid+"_"+vid]=Date.now();
  await update(ref(db,"progress/"+ME.uid),{watched:PROGRESS.watched});
  openSheet(`<h3><i class="fab fa-youtube" style="color:#ff0000;margin-right:8px"></i>${esc(v.title||"Video")}</h3><div style="width:100%;aspect-ratio:16/9;border-radius:14px;overflow:hidden;background:#000;box-shadow:0 8px 30px rgba(0,0,0,.6);"><iframe src="https://www.youtube.com/embed/${v.ytId}?autoplay=1&rel=0" style="width:100%;height:100%;border:none;" allow="autoplay; encrypted-media" allowfullscreen></iframe></div><div style="display:flex;gap:8px;margin-top:12px;"><button class="btn1" style="flex:1;background:#ff0000;" onclick="window.open('https://www.youtube.com/watch?v=${v.ytId}','_blank')"><i class="fab fa-youtube"></i> YouTube</button><button class="btn1" style="flex:1;background:var(--bg4);" onclick="closeSheet()">Close</button></div>`);
};
window.toggleBookmark=async function(sid,vid){const key=sid+"_"+vid;const r=ref(db,`bookmarks/${ME.uid}/${key}`);const s=await get(r);if(s.exists())await remove(r);else await set(r,{sid,vid,ts:Date.now()});toast(s.exists()?"Removed":"Saved ✅");};

/* ═════════ STUDY ═════════ */
function renderStudy(){
  const b=$("homeBody");
  let html=`<div style="display:flex;gap:6px;padding:10px 14px 4px;overflow-x:auto;">${[["goals","Today","fa-bullseye"],["timetable","Timetable","fa-calendar"],["tasks","Tasks","fa-list-check"],["focus","Focus","fa-stopwatch"]].map(([k,n,ic])=>`<button class="chip ${studyTab===k?'on':''}" onclick="setStudyTab('${k}')" style="flex-shrink:0;"><i class="fas ${ic}" style="margin-right:5px"></i>${n}</button>`).join("")}</div>`;
  if(studyTab==="goals"){
    const tk=todayKey();
    const goals=Object.entries(DAILY_GOALS[tk]||{}).map(([gid,g])=>({gid,...g})).sort((a,b)=>(a.done?1:-1)-(b.done?1:-1)||(a.ts||0)-(b.ts||0));
    const done=goals.filter(g=>g.done).length;
    html+=`<div style="padding:14px 16px 6px;"><h2 style="font-size:22px;font-weight:800;"><i class="fas fa-bullseye" style="color:var(--vi);margin-right:8px;"></i>Today's Goals</h2><p style="color:var(--tx2);font-size:13px;margin-top:4px;">${done}/${goals.length} completed · ${new Date().toLocaleDateString([],{weekday:'long',day:'numeric',month:'short'})}</p></div>`;
    if(!goals.length){html+=`<div class="empty" style="padding:50px 20px"><i class="fas fa-bullseye"></i><h3>No goals today</h3><p>Set today's goals to track your progress</p><button class="btn1" style="margin-top:16px;max-width:220px;" onclick="newDailyGoal()"><i class="fas fa-plus"></i> Add Goal</button></div>`;}
    else{html+=`<div class="add-inline" onclick="newDailyGoal()"><i class="fas fa-plus"></i> Add Goal</div>`;html+=goals.map(g=>`<div class="goal-card ${g.done?'done':''}"><div class="chk" onclick="toggleGoal('${g.gid}')"><i class="fas fa-check"></i></div><div class="body"><b>${esc(g.text||"Goal")}</b>${g.note?`<small>${esc(g.note)}</small>`:""}</div><button class="ib" style="width:32px;height:32px;font-size:13px;" onclick="delGoal('${g.gid}')"><i class="fas fa-trash" style="color:var(--rd)"></i></button></div>`).join("");}
  }else if(studyTab==="timetable"){
    const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    const today=new Date().getDay();
    if(curDay===null)curDay=today;
    html+=`<div class="day-tabs">${days.map((d,i)=>`<button class="day-tab ${curDay===i?'on':''}" onclick="setDay(${i})">${d}</button>`).join("")}</div>`;
    const dayData=TIMETABLE[curDay]||{};
    const periods=Object.entries(dayData).map(([pid,p])=>({pid,...p})).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    if(!periods.length){html+=`<div class="empty" style="padding:50px 20px"><i class="fas fa-calendar"></i><h3>No classes</h3><p>${meIsAdmin()?"Add timetable entries from Admin":"Timetable not set yet"}</p></div>`;}
    else{html+=periods.map(p=>{const subjName=p.subject?(SUBJECTS[p.subject]?.name||p.subject):"";return`<div class="period" style="border-left-color:${p.color||'#a06cff'}"><div class="time"><div class="t1">${esc(p.start||"--")}</div><div class="t2">${esc(p.end||"")}</div></div><div class="body"><h4>${esc(p.title||subjName||"Class")}</h4>${p.note?`<p>${esc(p.note)}</p>`:""}${subjName?`<span class="subj-chip">${esc(subjName)}</span>`:""}</div></div>`;}).join("");}
  }else if(studyTab==="tasks"){
    const tasks=Object.entries(TASKS).map(([tid,t])=>({tid,...t})).sort((a,b)=>(a.done?1:-1)-(b.done?1:-1)||(a.due||0)-(b.due||0));
    if(!tasks.length){html+=`<div class="empty" style="padding:50px 20px"><i class="fas fa-list-check"></i><h3>No tasks</h3><p>Add tasks to stay on track</p><button class="btn1" style="margin-top:16px;max-width:220px;" onclick="newTask()"><i class="fas fa-plus"></i> Add Task</button></div>`;}
    else{html+=`<div class="add-inline" onclick="newTask()"><i class="fas fa-plus"></i> Add Task</div>`;html+=tasks.map(t=>{const overdue=!t.done&&t.due&&t.due<Date.now();return`<div class="task-card ${t.done?'done':''}"><div class="chk" onclick="toggleTask('${t.tid}')"><i class="fas fa-check"></i></div><div class="body"><b>${esc(t.text||"Task")}</b>${t.due?`<small><i class="fas fa-clock"></i> ${new Date(t.due).toLocaleDateString()}${overdue?" · overdue":""}</small>`:""}</div><button class="ib" style="width:32px;height:32px;font-size:13px;" onclick="delTask('${t.tid}')"><i class="fas fa-trash" style="color:var(--rd)"></i></button></div>`;}).join("");}
  }else if(studyTab==="focus"){
    const tk=new Date().toDateString();
    const todayMin=Object.values(STUDY_SESSIONS||{}).filter(s=>new Date(s.ts).toDateString()===tk).reduce((a,s)=>a+(s.min||0),0);
    const todaySessions=Object.values(STUDY_SESSIONS||{}).filter(s=>new Date(s.ts).toDateString()===tk).length;
    const subjOpts=Object.entries(SUBJECTS).map(([sid,s])=>`<option value="${sid}">${esc(s.name)}</option>`).join("");
    html+=`<div style="padding:14px 16px;text-align:center;"><h2 style="font-size:22px;font-weight:800;"><i class="fas fa-stopwatch" style="color:var(--vi);margin-right:8px;"></i>Focus Timer</h2><p style="color:var(--tx2);font-size:13px;margin-top:4px;">Stay focused. Get things done.</p></div>`;
    html+=`<div class="focus-box"><div id="timerDisplay" class="timer-display">${timerState.running?fmtD(timerState.sec-Math.floor((Date.now()-timerState.start)/1000)):fmtD(timerState.sec||0)}</div><p style="color:var(--tx2);font-size:13px;margin-top:10px;">${timerState.running?"Stay focused! 🎯":"Ready when you are"}</p></div>`;
    if(!timerState.running){html+=`<div class="fld" style="padding:0 16px;"><label>Subject (optional)</label><select class="inp" id="focusSubject" style="padding:13px 16px;"><option value="">— None —</option>${subjOpts}</select></div><div class="chips" style="justify-content:center;padding:8px 16px 20px;">${[[25,"25 min"],[45,"45 min"],[60,"60 min"]].map(([m,n])=>`<button class="chip" onclick="startFocus(${m})"><i class="fas fa-play" style="margin-right:5px;"></i>${n}</button>`).join("")}</div>`;}
    else{html+=`<div style="padding:0 16px;"><button class="btn1" style="background:var(--rd);" onclick="stopFocus()"><i class="fas fa-stop"></i> Stop Timer</button></div>`;}
    html+=`<div style="margin:16px;padding:14px;background:var(--bg3);border-radius:16px;display:flex;gap:12px;text-align:center;"><div style="flex:1;"><b style="font-size:24px;display:block;color:var(--vi);font-family:'Inter',sans-serif;">${todayMin}</b><small style="font-size:11px;color:var(--tx2);">MINUTES TODAY</small></div><div style="flex:1;border-left:1px solid var(--bd);"><b style="font-size:24px;display:block;color:var(--cy);font-family:'Inter',sans-serif;">${todaySessions}</b><small style="font-size:11px;color:var(--tx2);">SESSIONS</small></div></div>`;
  }
  b.innerHTML=html;
}

/* DAILY GOALS */
window.newDailyGoal=async function(){

/* FOCUS TIMER */
window.startFocus=function(min){
  const subj=($("focusSubject")?.value)||null;
  if(timerState.int)clearInterval(timerState.int);
  timerState={running:true,start:Date.now(),sec:min*60,subject:subj,int:null};
  timerState.int=setInterval(()=>{
    const left=timerState.sec-Math.floor((Date.now()-timerState.start)/1000);
    if(left<=0){clearInterval(timerState.int);timerState.running=false;saveStudySession(min,subj);toast("Session complete! 🎉");renderHome();return;}
    const el=$("timerDisplay");
    if(el)el.textContent=fmtD(left);
  },1000);
  renderHome();
};
window.stopFocus=function(){if(timerState.int)clearInterval(timerState.int);timerState.running=false;renderHome();};
async function saveStudySession(min,subject){const sRef=push(ref(db,`studysessions/${ME.uid}`));await set(sRef,{min,subject:subject||null,ts:Date.now()});}

/* ═════════ STATS ═════════ */
function renderStats(){
  const b=$("homeBody");
  const ts=todayStats();
  const watched=Object.keys(PROGRESS.watched||{}).length;
  const totalMin=Object.values(STUDY_SESSIONS||{}).reduce((a,s)=>a+(s.min||0),0);
  const dgAll=Object.values(DAILY_GOALS||{}).flatMap(d=>Object.values(d));
  const goalsDone=dgAll.filter(g=>g.done).length;
  const watchedTs=Object.values(PROGRESS.watched||{});
  const days=new Set(watchedTs.map(ts=>new Date(ts).toDateString()));
  let streak=0;const today=new Date();for(let i=0;i<30;i++){const d=new Date(today);d.setDate(d.getDate()-i);if(days.has(d.toDateString()))streak++;else if(i>0)break;}
  let html=`<div style="padding:14px 16px 6px"><h2 style="font-size:22px;font-weight:800;">Your Progress</h2><p style="color:var(--tx2);font-size:13px;margin-top:4px;">Keep going — you're doing great!</p></div>`;
  html+=`<div class="stats-grid">
    <div class="stat-card"><div class="ic" style="background:linear-gradient(135deg,#a06cff,#e8457c)"><i class="fas fa-play"></i></div><b>${watched}</b><small>Videos Watched</small></div>
    <div class="stat-card"><div class="ic" style="background:linear-gradient(135deg,#4ae3d0,#5eb8ff)"><i class="fas fa-clock"></i></div><b>${Math.floor(totalMin/60)}h ${totalMin%60}m</b><small>Study Time</small></div>
    <div class="stat-card"><div class="ic" style="background:linear-gradient(135deg,#f0b232,#f15c6d)"><i class="fas fa-bullseye"></i></div><b>${goalsDone}</b><small>Goals Done</small></div>
    <div class="stat-card"><div class="ic" style="background:linear-gradient(135deg,#22c55e,#4ae3d0)"><i class="fas fa-fire"></i></div><b>${streak}🔥</b><small>Day Streak</small></div>
  </div>`;
  html+=`<div class="today-card"><h3><i class="fas fa-calendar-day"></i> Today</h3><div class="today-stats"><div class="today-stat"><b>${ts.watched}</b><small>Watched</small></div><div class="today-stat"><b>${ts.studyMin}</b><small>Min</small></div><div class="today-stat"><b>${ts.goalsDone}/${ts.goalsTotal}</b><small>Goals</small></div></div></div>`;
  const dayLabels=["S","M","T","W","T","F","S"];
  const todayIdx=new Date().getDay();
  html+=`<div style="padding:14px 16px 4px;font-size:12px;font-weight:800;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;">This week</div><div style="display:flex;gap:6px;margin:8px 14px;padding:14px;background:var(--bg3);border-radius:16px;justify-content:space-between;">${dayLabels.map((d,i)=>{const day=new Date();day.setDate(day.getDate()-(todayIdx-i));const act=days.has(day.toDateString());return`<div style="flex:1;text-align:center;"><div style="width:100%;aspect-ratio:1;border-radius:10px;background:${act?'linear-gradient(135deg,#a06cff,#e8457c)':'rgba(255,255,255,.06)'};display:flex;align-items:center;justify-content:center;color:${act?'#fff':'var(--tx3)'};font-size:11px;font-weight:800;">${act?'<i class="fas fa-check"></i>':d}</div><div style="font-size:10px;color:var(--tx3);margin-top:4px;font-weight:700;">${d}</div></div>`;}).join("")}</div>`;
  html+=`<div style="padding:18px 16px 0;font-size:12px;font-weight:800;color:var(--gr2);text-transform:uppercase;letter-spacing:.5px;">Subjects</div>`;
  Object.entries(SUBJECTS).forEach(([sid,s])=>{const vids=Object.keys(VIDEOS[sid]||{}).length;const w=Object.keys(VIDEOS[sid]||{}).filter(vid=>PROGRESS.watched&&PROGRESS.watched[sid+"_"+vid]).length;const pct=vids?Math.round(w/vids*100):0;html+=`<div style="margin:10px 14px;padding:14px;background:var(--bg3);border-radius:16px;"><div style="display:flex;align-items:center;gap:10px;margin-bottom:8px;"><div style="width:34px;height:34px;border-radius:10px;background:${s.color||'linear-gradient(135deg,#a06cff,#e8457c)'};display:flex;align-items:center;justify-content:center;color:#fff;font-size:14px;"><i class="fas ${s.icon||'fa-book'}"></i></div><b style="flex:1;font-size:14px;">${esc(s.name)}</b><span style="font-size:13px;font-weight:800;color:${pct>=100?'var(--gn)':'var(--vi)'}">${pct}%</span></div><div style="height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;"><div style="height:100%;width:${pct}%;border-radius:6px;background:linear-gradient(90deg,#a06cff,#e8457c);"></div></div><div style="font-size:11.5px;color:var(--tx3);margin-top:6px;">${w} of ${vids} watched</div></div>`;});
  b.innerHTML=html;
}

function nameH(u){const b=(isAdmin(u)||u.verified)?'<span class="bdg"><i class="fas fa-check"></i></span>':"";return`${esc(dispName(u))}${b}`;}
function avH(u){const p=u.photoURL?`<img src="${u.photoURL}">`:ini(u.name);const on=u.online?"on":"";const c=(isAdmin(u)||u.verified)?'<span class="crown"><i class="fas fa-check"></i></span>':"";return`<div class="av ${on}">${p}<span class="dot"></span>${c}</div>`;}
function dispName(u){return(u&&((u.uid&&SAVED[u.uid]&&SAVED[u.uid].name)||u.name))||"User";}
function stText(o){if(!o)return"";if(o.online)return"online";return"last seen "+fmtT(o.lastSeen);}

function renderChats(){
  const b=$("homeBody");
  const list=Object.entries(myChats).map(([cid,c])=>{const others=Object.keys(c.participants).filter(k=>k!==ME.uid);if(c.type==="group")return{cid,chat:c,otherId:null,other:{name:c.groupName||"Group",photoURL:c.groupPhoto,isGroup:true}};const oid=others[0],o=allUsers[oid]||{name:"User"};return{cid,chat:c,otherId:oid,other:o};}).sort((a,b)=>(b.chat.lastTime||0)-(a.chat.lastTime||0));
  if(!list.length){b.innerHTML=`<div class="empty"><i class="fas fa-comments"></i><h3>No chats yet</h3><p>Tap + to search users or start a new chat</p><button class="btn1" style="max-width:240px;margin-top:8px;" onclick="openGlobalSearch()"><i class="fas fa-search"></i> Search Users</button></div>`;return;}
  b.innerHTML=list.map(({cid,chat,otherId,other})=>{const unread=unreadLocal[cid]||0;const av=other.isGroup?`<div class="av">${other.photoURL?`<img src="${other.photoURL}">`:'<i class="fas fa-users"></i>'}</div>`:avH(other);return`<div class="ci" onclick="openChat('${otherId||cid}',${other.isGroup?true:false})">${av}<div class="ci-info"><div class="ci-top"><div class="ci-name">${other.isGroup?esc(other.name):nameH(other)}</div><div class="ci-time">${fmtT(chat.lastTime)}</div></div><div class="ci-bot"><div class="ci-msg">${esc(chat.lastMessage||"")}</div>${unread?`<div class="ci-un">${unread}</div>`:""}</div></div></div>`;}).join("");
}

window.openChat=async function(uid,isGroup){
  curChatId=(isGroup)?uid:[ME.uid,uid].sort().join("__");
  const s=await get(ref(db,"chats/"+curChatId));let c=s.val();
  if(!c){if(isGroup){toast("Group not found");return;}c={participants:{[ME.uid]:true,[uid]:true}};await set(ref(db,"chats/"+curChatId),c);}
  curChat=c;curOther=isGroup?{name:c.groupName||"Group",isGroup:true}:(allUsers[uid]||{name:"User"});
  MSGS={};unreadLocal[curChatId]=0;cache.set("unread",unreadLocal);
  $("chName").innerHTML=isGroup?esc(curOther.name):nameH(curOther);
  $("chStat").textContent=isGroup?`${Object.keys(c.participants).length} members`:stText(curOther);
  $("chAv").innerHTML=isGroup?(c.groupPhoto?`<img src="${c.groupPhoto}">`:'<i class="fas fa-users"></i>'):(curOther.photoURL?`<img src="${curOther.photoURL}">`:ini(curOther.name));
  show("chatRoom");$("msgs").innerHTML='<div class="sp"></div>';
  setTimeout(()=>$("msgIn").focus(),100);
  loadMessages();watchTyping();clearReply();
};
window.closeChat=function(){if(msgUn){off(ref(db,"messages/"+curChatId));msgUn=null;}if(typUn){off(ref(db,"typing/"+curChatId));typUn=null;}remove(ref(db,"typing/"+curChatId+"/"+ME.uid)).catch(()=>{});curChatId=null;curChat=null;curOther=null;show("home");renderHome();};

function loadMessages(){const c=$("msgs");c.innerHTML='<div class="sp"></div>';let first=true;msgUn=onValue(ref(db,"messages/"+curChatId),s=>{const d=s.val()||{},now=Date.now();const list=Object.entries(d).map(([k,v])=>({id:k,...v})).filter(m=>{if(m.disappearAt&&m.disappearAt<now)return false;if(m.deletedFor&&m.deletedFor[ME.uid])return false;return true;}).sort((a,b)=>(a.ts||0)-(b.ts||0));list.forEach(m=>{if(m.sender!==ME.uid&&m.status!=="read"){update(ref(db,`messages/${curChatId}/${m.id}`),{status:"read"}).catch(()=>{});}});if(!list.length){c.innerHTML=`<div class="empty" style="padding:40px 20px;"><i class="fas fa-comment"></i><p>No messages yet. Say hi! 👋</p></div>`;return;}list.forEach(m=>{MSGS[m.id]=m;});const keep=c.scrollTop,nearBottom=(c.scrollHeight-c.scrollTop-c.clientHeight)<180;c.innerHTML=list.map(m=>renderMsg(m)).join("");requestAnimationFrame(()=>{c.scrollTop=(first||nearBottom||list[list.length-1].sender===ME.uid)?c.scrollHeight:keep;first=false;});});}

function renderMsg(m){const isMe=m.sender===ME.uid;let tick="";if(isMe){if(m.status==="read")tick='<i class="fas fa-check-double rd"></i>';else if(m.status==="delivered")tick='<i class="fas fa-check-double"></i>';else tick='<i class="fas fa-check"></i>';}
  let body="",isSticker=false;
  if(m.type==="sticker"){isSticker=true;body=`<img class="stk" src="${m.mediaUrl}" onclick="openViewer('${m.mediaUrl}')">`;}
  else if(m.type==="image"){body=`<img class="mimg" src="${m.mediaUrl}" onclick="openViewer('${m.mediaUrl}')">`+(m.text?`<div>${esc(m.text)}</div>`:"");}
  else if(m.type==="voice"){body=`<div style="display:flex;align-items:center;gap:10px;padding:4px 0;min-width:170px;"><button onclick="playVoice('${m.mediaUrl}',this)" style="width:34px;height:34px;border-radius:50%;background:var(--vi);color:#fff;display:flex;align-items:center;justify-content:center;"><i class="fas fa-play"></i></button><span style="font-size:11.5px;color:rgba(255,255,255,.7)">${fmtD(m.duration)}</span></div>`;}
  else if(m.type==="deleted"){body=`<i style="color:rgba(255,255,255,.5);font-style:italic;">🚫 This message was deleted</i>`;}
  else{if(m.text&&ytId(m.text)){const yid=ytId(m.text);body=`<div onclick="playChatVideo('${yid}')" style="max-width:280px;border-radius:12px;overflow:hidden;background:rgba(0,0,0,.35);cursor:pointer;"><img src="${ytThumb(yid)}" style="width:100%;display:block;"><div style="padding:8px 10px;font-size:12px;color:#fff;">▶ YouTube Video</div></div>`;}else{body=esc(m.text||"");}}
  let sname="";if(curChat?.type==="group"&&!isMe){const u=allUsers[m.sender];sname=`<div class="sndr">${esc(u?.name||"User")}</div>`;}
  const ctx=`oncontextmenu="msgMenu(event,'${m.id}');return false"`;
  if(isSticker)return`<div class="msg sticker ${isMe?'out':'in'}" data-mid="${m.id}" ${ctx}>${body}<div class="meta">${fmtT(m.ts)} ${tick}</div></div>`;
  return`<div class="msg ${isMe?'out':'in'}" data-mid="${m.id}" ${ctx}>${sname}<div class="tx">${body}</div><div class="meta">${fmtT(m.ts)} ${tick}</div></div>`;
}

window.recVoice=async function(){if(recorder&&recorder.state==="recording"){recorder.stop();return;}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});recChunks=[];recorder=new MediaRecorder(stream);recorder.ondataavailable=e=>recChunks.push(e.data);recorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());$("micBtn").classList.remove("rc");$("micBtn").innerHTML='<i class="fas fa-microphone"></i>';updateSendBtn();const blob=new Blob(recChunks,{type:recorder.mimeType||"audio/webm"});const dur=Math.round((Date.now()-recordT)/1000);toast("Sending voice...");try{const f=new File([blob],"v.webm",{type:blob.type||"audio/webm"});const fd=new FormData();fd.append("reqtype","fileupload");fd.append("fileToUpload",f);const r=await fetch("https://catbox.moe/user/api.php",{method:"POST",body:fd});const u=(await r.text()).trim();if(!u||!u.startsWith("http"))throw new Error("Upload failed");const mRef=push(ref(db,"messages/"+curChatId));await set(mRef,{sender:ME.uid,type:"voice",mediaUrl:u,duration:dur,ts:Date.now(),status:"sent"});await update(ref(db,"chats/"+curChatId),{lastMessage:"🎤 Voice",lastTime:Date.now(),lastSender:ME.uid,participants:{...curChat.participants,[ME.uid]:true}});toast("Sent ✅");}catch(e){toast("Failed: "+e.message);}};recordT=Date.now();recorder.start();$("micBtn").classList.add("rc");$("micBtn").innerHTML='<i class="fas fa-stop"></i>';toast("Recording... tap stop");}catch(e){toast("Mic denied");}};
window.playVoice=function(url,btn){if(audios[url]){audios[url].pause();delete audios[url];btn.innerHTML='<i class="fas fa-play"></i>';return;}const a=new Audio(url);audios[url]=a;a.play();btn.innerHTML='<i class="fas fa-pause"></i>';a.onended=()=>{delete audios[url];btn.innerHTML='<i class="fas fa-play"></i>';};};

window.importWastickers=async function(file){
  if(!file)return;
  const status=$("wastStatus");
  if(status)status.innerHTML='<i class="fas fa-spinner fa-spin"></i> Reading file...';
  try{
    const zip=await JSZip.loadAsync(file);
    let title="Imported Pack",author="";
    try{if(zip.file("title.txt"))title=(await zip.file("title.txt").async("string")).trim()||title;}catch(e){}
    try{if(zip.file("author.txt"))author=(await zip.file("author.txt").async("string")).trim();}catch(e){}
    const webpFiles=Object.keys(zip.files).filter(n=>/^\d+\.(webp|png|jpg|jpeg)$/i.test(n)).sort((a,b)=>parseInt(a)-parseInt(b));
    if(!webpFiles.length){if(status)status.innerHTML='<i class="fas fa-times-circle" style="color:var(--rd)"></i> No stickers in file';return;}
    let trayUrl=null;
    if(zip.file("tray.webp")){try{const tb=await zip.file("tray.webp").async("blob");trayUrl=await upImgBlob(tb,"tray.webp");}catch(e){}}
    const stickerUrls=[];
    for(let i=0;i<webpFiles.length;i++){
      if(status)status.innerHTML=`<i class="fas fa-upload"></i> Uploading ${i+1}/${webpFiles.length}...`;
      try{const blob=await zip.file(webpFiles[i]).async("blob");const url=await upImgBlob(blob,"stk_"+i+".webp");stickerUrls.push(url);}catch(e){console.log("skip",e);}
    }
    if(!stickerUrls.length){if(status)status.innerHTML='<i class="fas fa-times-circle" style="color:var(--rd)"></i> Upload failed';return;}
    const packId="wp_"+Date.now();
    await set(ref(db,`stickers/${ME.uid}/${packId}`),{name:title,author,tray:trayUrl||stickerUrls[0],stickers:stickerUrls.reduce((a,u,i)=>({...a,["s"+i]:u}),{}),ts:Date.now(),source:"wastickers"});
    if(status)status.innerHTML=`<i class="fas fa-check-circle" style="color:var(--gn)"></i> Imported ${stickerUrls.length} stickers ✅`;
    toast(`Imported ${stickerUrls.length} stickers`);
    setTimeout(()=>openStickerSheet(),900);
  }catch(e){if(status)status.innerHTML=`<i class="fas fa-times-circle" style="color:var(--rd)"></i> ${esc(e.message||"Failed")}`;}
};

    <div style="background:rgba(160,108,255,.08);border:1px solid rgba(160,108,255,.2);padding:12px;border-radius:12px;font-size:12px;color:#c99dff;margin-bottom:14px;line-height:1.65;">

    </div>
    <input type="file" id="makerFile" accept="image/*" hidden onchange="makeStickerFromFile(this.files[0])">
    <div id="makerPreview"></div>

window.makeStickerFromFile=async function(file){
  if(!file)return;
  const preview=$("makerPreview"),status=$("makerStatus");
  if(status)status.innerHTML='<i class="fas fa-spinner fa-spin"></i> Processing...';
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();const u=URL.createObjectURL(file);i.onload=()=>{URL.revokeObjectURL(u);res(i);};i.onerror=()=>{URL.revokeObjectURL(u);rej(new Error("Invalid image"));};i.src=u;});
    const c=document.createElement("canvas");c.width=512;c.height=512;
    const ctx=c.getContext("2d");
    const scale=Math.min(512/img.width,512/img.height);
    const w=img.width*scale,h=img.height*scale;
    ctx.drawImage(img,(512-w)/2,(512-h)/2,w,h);
    const blob=await new Promise(res=>c.toBlob(res,"image/webp",0.9));
    const url=URL.createObjectURL(blob);
    if(preview)preview.innerHTML=`<div class="maker-preview"><img src="${url}"></div>`;
    if(status)status.innerHTML='<i class="fas fa-upload"></i> Uploading...';
    const up=await upImgBlob(blob,"made_"+Date.now()+".webp");
    if(status)status.innerHTML='';
    const{value:packName,isConfirmed}=await SW.fire({title:"Add to pack",input:"text",inputPlaceholder:"Pack name",inputValue:"My Stickers",showCancelButton:true,confirmButtonText:"Save"});
    if(!isConfirmed)return;
    let packId=null;
    for(const[pid,p]of Object.entries(MY_STICKERS)){if((p.name||"")===(packName||"My Stickers")){packId=pid;break;}}
    if(!packId){packId="made_"+Date.now();await set(ref(db,`stickers/${ME.uid}/${packId}`),{name:packName||"My Stickers",tray:up,stickers:{s0:up},ts:Date.now(),source:"made"});}
    else{const sRef=push(ref(db,`stickers/${ME.uid}/${packId}/stickers`));await set(sRef,up);}
    toast("Sticker added ✅");
    setTimeout(()=>openStickerSheet(),800);
  }catch(e){if(status)status.innerHTML=`<i class="fas fa-times-circle" style="color:var(--rd)"></i> ${esc(e.message)}`;}
};

function renderAdminPanel(t){

    content=`<div class="fld"><label>Subject</label><select class="inp" id="vSubSel" onchange="manageVideos(this.value)" style="padding:13px 16px;">${subs.map(s=>`<option value="${s.sid}" ${s.sid===curSubject?'selected':''}>${esc(s.name)}</option>`).join("")}</select></div>`;

      content+=`<div class="add-inline" onclick="editVideo('${curSubject}')"><i class="fas fa-plus"></i> Add Video</div>`;
      if(!vids.length)content+=`<div style="padding:20px;text-align:center;color:var(--tx3);">No videos.</div>`;
      else content+=vids.map(v=>`<div class="ad-row"><div style="width:64px;height:36px;border-radius:8px;overflow:hidden;flex-shrink:0;background:#000;"><img src="${v.ytId?ytThumb(v.ytId):''}" style="width:100%;height:100%;object-fit:cover;" onerror="this.style.opacity=.2"></div><div style="flex:1;min-width:0;"><b style="font-size:12.5px;">${esc(v.title||"Untitled")}</b><small style="display:block;font-size:11px;color:var(--tx3);">${v.tag?esc(v.tag):"no tag"}</small></div><button class="btn-mini btn-bl" onclick="editVideo('${curSubject}','${v.vid}')"><i class="fas fa-pen"></i></button><button class="btn-mini btn-red" onclick="delVideo('${curSubject}','${v.vid}')"><i class="fas fa-trash"></i></button></div>`).join("");
    }else content+=`<div style="padding:20px;text-align:center;color:var(--tx3);">Select a subject.</div>`;
  }
  if(t==="timetable"){
    const days=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    if(curDay===null)curDay=new Date().getDay();
    content=`<div class="day-tabs" style="padding:0 0 10px;">${days.map((d,i)=>`<button class="day-tab ${curDay===i?'on':''}" onclick="adminSetDay(${i})">${d}</button>`).join("")}</div><div class="add-inline" onclick="editPeriod()"><i class="fas fa-plus"></i> Add Period</div>`;
    const dayData=TIMETABLE[curDay]||{};
    const periods=Object.entries(dayData).map(([pid,p])=>({pid,...p})).sort((a,b)=>(a.start||"").localeCompare(b.start||""));
    if(!periods.length)content+=`<div style="padding:20px;text-align:center;color:var(--tx3);">No periods.</div>`;
    else content+=periods.map(p=>`<div class="ad-row"><div style="flex:1;min-width:0;"><b>${esc(p.title||p.subject||"Class")}</b><small style="display:block;font-size:11.5px;color:var(--tx3);">${esc(p.start||"")}–${esc(p.end||"")} ${p.note?"· "+esc(p.note):""}</small></div><button class="btn-mini btn-bl" onclick="editPeriod('${p.pid}')"><i class="fas fa-pen"></i></button><button class="btn-mini btn-red" onclick="delPeriod('${p.pid}')"><i class="fas fa-trash"></i></button></div>`).join("");
  }
  if(t==="users"){
    content=`<div style="max-height:60vh;overflow-y:auto;">${allU.map(u=>`<div class="ad-row">${avH(u)}<div style="flex:1;min-width:0;"><b>${esc(u.name||"User")} ${u.banned?'<span class="tag rd">BANNED</span>':''}</b><small style="display:block;font-size:11.5px;color:var(--tx3);">${esc(u.phone||"")}</small></div><button class="btn-mini ${u.banned?'btn-red on':'btn-red'}" onclick="toggleBan('${u.uid}')">${u.banned?"UNBAN":"BAN"}</button></div>`).join("")}</div>`;
  }
  if(t==="exam"){
    const cur=CFG.examDate?new Date(CFG.examDate).toISOString().split('T')[0]:'';
    content=`<div class="fld"><label>Exam date</label><input class="inp" id="examDateInp" type="date" value="${cur}" style="padding:13px 16px;"></div><button class="btn1" onclick="saveExamDate()"><i class="fas fa-save"></i> Save</button>${CFG.examDate?`<button class="btn1" style="background:var(--rd);margin-top:8px;" onclick="clearExamDate()"><i class="fas fa-trash"></i> Clear</button>`:''}`;
  }
  if(t==="flags"){
    content=`<div class="sheet-item"><i class="fas fa-tools"></i><div class="lbl"><b>Maintenance Mode</b><small>${CFG.maintenance?"ON":"OFF"}</small></div><div class="sw ${CFG.maintenance?'on':''}" onclick="toggleFlag('maintenance')" style="width:46px;height:26px;border-radius:20px;background:${CFG.maintenance?'var(--vi)':'var(--bg4)'};position:relative;"><i style="position:absolute;top:3px;left:${CFG.maintenance?'23px':'3px'};width:20px;height:20px;border-radius:50%;background:#fff;transition:.25s;"></i></div></div>`;
  }
  const html=`<h3><i class="fas fa-crown" style="color:#f0b232;"></i> Admin Panel</h3><div class="admin-tabs"><button class="atab ${t==='subjects'?'on':''}" onclick="renderAdminPanel('subjects')">Subjects</button><button class="atab ${t==='videos'?'on':''}" onclick="renderAdminPanel('videos')">Videos</button><button class="atab ${t==='timetable'?'on':''}" onclick="renderAdminPanel('timetable')">Timetable</button><button class="atab ${t==='users'?'on':''}" onclick="renderAdminPanel('users')">Users</button><button class="atab ${t==='exam'?'on':''}" onclick="renderAdminPanel('exam')">Exam</button><button class="atab ${t==='flags'?'on':''}" onclick="renderAdminPanel('flags')">Flags</button></div><div>${content}</div>`;
  openSheet(html);
}
window.renderAdminPanel=renderAdminPanel;
window.adminSetDay=function(d){curDay=d;renderAdminPanel("timetable");};
window.toggleBan=async function(uid){const u=allUsers[uid];if(!u)return;await update(ref(db,"users/"+uid),{banned:!u.banned});toast(u.banned?"Unbanned":"Banned");renderAdminPanel("users");};
window.toggleFlag=async function(k){const v=!CFG[k];await update(ref(db,"config"),{[k]:v});CFG[k]=v;toast(v?"Enabled":"Disabled");renderAdminPanel("flags");};
window.saveExamDate=async function(){const v=($("examDateInp").value||"").trim();if(!v)return toast("Pick date");await update(ref(db,"config"),{examDate:new Date(v).getTime()});CFG.examDate=new Date(v).getTime();toast("Saved ✅");renderAdminPanel("exam");};
window.clearExamDate=async function(){await update(ref(db,"config"),{examDate:null});CFG.examDate=null;toast("Cleared");renderAdminPanel("exam");};

/* SUBJECT CRUD */
window.editSubject=async function(sid){const s=sid?SUBJECTS[sid]:{};const{value:fd}=await SW.fire({title:sid?"Edit Subject":"New Subject",html:`<input id="sName" class="swal2-input" placeholder="Subject name" value="${esc(s.name||"")}"><input id="sIcon" class="swal2-input" placeholder="Icon (fa-book)" value="${esc(s.icon||"fa-book")}" style="margin-top:8px"><input id="sColor" class="swal2-input" placeholder="Color gradient (e.g. linear-gradient(135deg,#a06cff,#e8457c))" value="${esc(s.color||"")}" style="margin-top:8px"><input id="sOrder" class="swal2-input" type="number" placeholder="Order" value="${s.order||0}" style="margin-top:8px">`,showCancelButton:true,confirmButtonText:"Save",preConfirm:()=>{const n=document.getElementById("sName").value.trim();if(!n){Swal.showValidationMessage("Name required");return false;}return{name:n,icon:document.getElementById("sIcon").value.trim()||"fa-book",color:document.getElementById("sColor").value.trim()||"linear-gradient(135deg,#a06cff,#e8457c)",order:parseInt(document.getElementById("sOrder").value)||0};}});if(!fd)return;if(sid)await update(ref(db,"subjects/"+sid),fd);else await set(ref(db,"subjects/s_"+Date.now()),{...fd,ts:Date.now()});toast("Saved ✅");renderAdminPanel("subjects");};
window.delSubject=async function(sid){const r=await SW.fire({icon:"warning",title:"Delete subject?",text:"All videos inside will be deleted.",showCancelButton:true,confirmButtonText:"Delete"});if(!r.isConfirmed)return;await remove(ref(db,"subjects/"+sid));await remove(ref(db,"videos/"+sid));toast("Deleted");renderAdminPanel("subjects");};
window.manageVideos=function(sid){curSubject=sid;listenVideos(sid);renderAdminPanel("videos");};
window.editVideo=async function(sid,vid){const v=vid?(VIDEOS[sid]||{})[vid]:{};const{value:fd}=await SW.fire({title:vid?"Edit Video":"New Video",html:`<input id="vUrl" class="swal2-input" placeholder="YouTube URL" value="${esc(v.url||"")}"><input id="vTitle" class="swal2-input" placeholder="Title" value="${esc(v.title||"")}" style="margin-top:8px"><input id="vTag" class="swal2-input" placeholder="Tag (September/October/etc)" value="${esc(v.tag||"")}" style="margin-top:8px"><input id="vOrder" class="swal2-input" type="number" placeholder="Order" value="${v.order||0}" style="margin-top:8px">`,showCancelButton:true,confirmButtonText:"Save",preConfirm:()=>{const u=document.getElementById("vUrl").value.trim();const t=document.getElementById("vTitle").value.trim();if(!u&&!vid){Swal.showValidationMessage("URL required");return false;}const yid=u?ytId(u):(v.ytId||null);if(u&&!yid){Swal.showValidationMessage("Invalid YouTube URL");return false;}if(!t){Swal.showValidationMessage("Title required");return false;}return{url:u||v.url,ytId:yid,title:t,tag:document.getElementById("vTag").value.trim(),order:parseInt(document.getElementById("vOrder").value)||0};}});if(!fd)return;if(vid)await update(ref(db,"videos/"+sid+"/"+vid),fd);else await set(ref(db,"videos/"+sid+"/v_"+Date.now()),{...fd,ts:Date.now()});toast("Saved ✅");renderAdminPanel("videos");};
window.delVideo=async function(sid,vid){const r=await SW.fire({icon:"warning",title:"Delete video?",showCancelButton:true,confirmButtonText:"Delete"});if(!r.isConfirmed)return;await remove(ref(db,"videos/"+sid+"/"+vid));toast("Deleted");renderAdminPanel("videos");};
window.editPeriod=async function(pid){const p=pid?(TIMETABLE[curDay]||{})[pid]:{};const subjOpts=Object.entries(SUBJECTS).map(([sid,s])=>`<option value="${sid}" ${p.subject===sid?'selected':''}>${esc(s.name)}</option>`).join("");const{value:fd}=await SW.fire({title:pid?"Edit Period":"New Period",html:`<input id="pStart" class="swal2-input" placeholder="Start (08:00)" value="${esc(p.start||"")}"><input id="pEnd" class="swal2-input" placeholder="End (10:00)" value="${esc(p.end||"")}" style="margin-top:8px"><input id="pTitle" class="swal2-input" placeholder="Title" value="${esc(p.title||"")}" style="margin-top:8px"><select id="pSubject" class="swal2-select" style="width:80%;margin-top:8px"><option value="">— Subject —</option>${subjOpts}</select><input id="pNote" class="swal2-input" placeholder="Note (optional)" value="${esc(p.note||"")}" style="margin-top:8px">`,showCancelButton:true,confirmButtonText:"Save",preConfirm:()=>({start:document.getElementById("pStart").value.trim(),end:document.getElementById("pEnd").value.trim(),title:document.getElementById("pTitle").value.trim(),subject:document.getElementById("pSubject").value,note:document.getElementById("pNote").value.trim()})});if(!fd)return;if(pid)await update(ref(db,`timetable/${curDay}/${pid}`),fd);else await set(ref(db,`timetable/${curDay}/p_${Date.now()}`),{...fd,ts:Date.now()});toast("Saved ✅");renderAdminPanel("timetable");};
window.delPeriod=async function(pid){const r=await SW.fire({icon:"warning",title:"Delete period?",showCancelButton:true,confirmButtonText:"Delete"});if(!r.isConfirmed)return;await remove(ref(db,`timetable/${curDay}/${pid}`));toast("Deleted");renderAdminPanel("timetable");};

/* ═════════ NATIVE STICKER SHARE INTEGRATION ═════════ */
window.handleIncomingSticker = async function(url){
  try{
    const uri = decodeURIComponent(url.split("uri=")[1]);
    console.log("Sticker import URI:", uri);
    if(!window.Capacitor?.Plugins?.Filesystem){
      toast("Please update app to import stickers");
      return;
    }
    const {Filesystem} = window.Capacitor.Plugins;
    const data = await Filesystem.readFile({path: uri});
    const b64 = data.data;
    const byteChars = atob(b64);
    const byteNums = new Array(byteChars.length);
    for(let i=0;i<byteChars.length;i++) byteNums[i]=byteChars.charCodeAt(i);
    const bytes = new Uint8Array(byteNums);
    const blob = new Blob([bytes],{type:"application/zip"});
    const file = new File([blob],"import.wastickers",{type:"application/zip"});
    openWastickersImport();
    setTimeout(()=>importWastickers(file),300);
  }catch(e){
    console.error(e);
    toast("Import failed: "+e.message);
  }
};

(async()=>{
  try{
    if(window.Capacitor?.Plugins?.App){
      const {App} = window.Capacitor.Plugins;
      const launch = await App.getLaunchUrl();
      if(launch?.url) setTimeout(()=>handleIncomingSticker(launch.url),2000);
      App.addListener("appUrlOpen",d=>{if(d?.url)handleIncomingSticker(d.url);});
    }
  }catch(e){}
})();
